<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Bejelentkezés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        <div class="text-center mb-8">
            <span class="text-4xl">🛡️</span>
            <h1 class="text-2xl font-bold tracking-wide mt-2">QuotaGuard</h1>
            <p class="text-xs text-slate-400 mt-1">Kórházi Tételes Gyógyszerkezelő Rendszer</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Felhasználónév (Teljes név)</label>
                <input type="text" id="username-input" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="pl. Dr. Tarszabó Gergely">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Jelszó</label>
                <input type="password" id="password-input" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
            </div>
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-lg text-sm">
                Belépés a Rendszerbe
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const nameInput = document.getElementById('username-input').value.trim();
            const passwordInput = document.getElementById('password-input').value.trim();

            if (!nameInput || !passwordInput) {
                alert('Kérlek add meg a neved és a jelszavad!');
                return;
            }

            const { data, error } = await _supabase
                .from('users')
                .select('*')
                .eq('full_name', nameInput)
                .eq('password', passwordInput)
                .single();

            if (error || !data) {
                alert('Hibás név vagy jelszó!');
                return;
            }

            // Adatok eltárolása a böngészőben, hogy az aloldalak is tudják, ki lépett be
            localStorage.setItem('qg_user', data.full_name);
            localStorage.setItem('qg_role', data.role);
            localStorage.setItem('qg_ward', data.ward_name || '');

            // Irányítás a szerepkör szerint
            if (data.role === 'ward') {
                window.location.href = 'ward-new-order.html';
            } else if (data.role === 'pharmacy') {
                window.location.href = 'pharmacy-orders.html';
            } else if (data.role === 'admin') {
                alert('Admin felület előkészítés alatt.');
            }
        }
    </script>
</body>
</html>
