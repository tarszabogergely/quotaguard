<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Tételes Gyógyszerkezelő</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript Kliens -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">v1.0 Élő kapcsolat</span>
            </div>
            <div id="user-info" class="text-sm text-indigo-200 hidden">
                Bejelentkezve mint: <span id="logged-user" class="font-semibold text-white"></span> 
                (<span id="logged-role" class="underline"></span>)
                <button onclick="logout()" class="ml-4 bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded text-xs">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- 1. BEJELENTKEZÉS KÉPERNYŐ -->
        <div id="login-section" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 mt-12 border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Rendszerbe lépés</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Felhasználónév / Név</label>
                    <input type="text" id="username-input" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. Kovács Éva">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Szerepkör / Hely</label>
                    <select id="role-select" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="ward">Osztály (pl. Belgyógyászat)</option>
                        <option value="pharmacy">Központi Gyógyszertár</option>
                    </select>
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                    Belépés
                </button>
            </div>
        </div>

        <!-- 2. OSZTÁLYI FELÜLET (Rendelés leadás) -->
        <div id="ward-section" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow p-6 border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <span class="mr-2">📝</span> Új gyógyszerigény leadása (Osztály)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg neve</label>
                        <input type="text" id="ward-patient" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Minta Béla">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg azonosító (TAJ / Kód)</label>
                        <input type="text" id="ward-patient-id" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="123 456 789">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve / Hatóanyag</label>
                        <input type="text" id="ward-drug" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="pl. AB gyógyszer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Indikáció</label>
                        <input type="text" id="ward-indication" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Indikáció megnevezése">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz)</label>
                        <input type="number" id="ward-qty" class="w-full px-3 py-2 border rounded-lg text-sm" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mikorra kérik?</label>
                        <input type="datetime-local" id="ward-date" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <button onclick="submitOrder()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-medium shadow">
                    Rendelés elküldése a Patikának
                </button>
            </div>
        </div>

        <!-- 3. GYÓGYSZERTÁRI FELÜLET -->
        <div id="pharmacy-section" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow p-6 border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <span class="mr-2">📦</span> Gyógyszerek bevételezése (Szállítólevél)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve</label>
                        <input type="text" id="pharm-drug" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="AB gyógyszer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Szállítólevél száma</label>
                        <input type="text" id="pharm-delivery" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="SZ-2026/001">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz)</label>
                        <input type="number" id="pharm-qty" class="w-full px-3 py-2 border rounded-lg text-sm" value="10" min="1">
                    </div>
                </div>
                <button onclick="saveReceipt()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium shadow">
                    Bevétel rögzítése (FIFO)
                </button>
            </div>
        </div>

    </main>

    <!-- Adatbázis Kapcsolat és Működés -->
    <script>
        // IDE ÍRD BE A SAJÁT SUPABASE URL-EDET:
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        // Inicializálás
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRole = null;

        function login() {
            currentUser = document.getElementById('username-input').value.trim();
            currentRole = document.getElementById('role-select').value;

            if (!currentUser) {
                alert('Kérlek add meg a neved!');
                return;
            }

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('logged-user').innerText = currentUser;
            document.getElementById('logged-role').innerText = currentRole === 'ward' ? 'Osztály' : 'Gyógyszertár';

            if (currentRole === 'ward') {
                document.getElementById('ward-section').classList.remove('hidden');
            } else {
                document.getElementById('pharmacy-section').classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }

        async function submitOrder() {
            const patientName = document.getElementById('ward-patient').value;
            const patientId = document.getElementById('ward-patient-id').value;
            const drugName = document.getElementById('ward-drug').value;
            const indication = document.getElementById('ward-indication').value;
            const quantity = parseInt(document.getElementById('ward-qty').value);
            const pickupDate = document.getElementById('ward-date').value;

            if (!patientName || !drugName || !pickupDate) {
                alert('Kérlek töltsd ki a kötelező mezőket (Beteg, Gyógyszer, Időpont)!');
                return;
            }

            const { data, error } = await _supabase
                .from('orders')
                .insert([
                    {
                        ward_name: currentUser + ' (Osztály)',
                        patient_name: patientName,
                        patient_identifier: patientId,
                        drug_name: drugName,
                        indication: indication,
                        quantity: quantity,
                        requested_pickup_date: pickupDate,
                        status: 'pending'
                    }
                ]);

            if (error) {
                alert('Hiba történt a mentéskor: ' + error.message);
            } else {
                alert('Sikeres rendelés elküldve a QuotaGuard adatbázisba! 🛡️');
                document.getElementById('ward-patient').value = '';
                document.getElementById('ward-patient-id').value = '';
                document.getElementById('ward-drug').value = '';
                document.getElementById('ward-indication').value = '';
            }
        }

        async function saveReceipt() {
            const drugName = document.getElementById('pharm-drug').value;
            const deliveryNote = document.getElementById('pharm-delivery').value;
            const qty = parseInt(document.getElementById('pharm-qty').value);

            if (!drugName || !deliveryNote) {
                alert('Add meg a gyógyszer nevét és a szállítólevél számát!');
                return;
            }

            const { data, error } = await _supabase
                .from('inventory_receipts')
                .insert([
                    {
                        drug_name: drugName,
                        delivery_note_number: deliveryNote,
                        initial_quantity: qty,
                        current_quantity: qty,
                        expiry_date: '2027-12-31'
                    }
                ]);

            if (error) {
                alert('Hiba a bevételezéskor: ' + error.message);
            } else {
                alert('Sikeres bevételezés rögzítve a FIFO készletbe! 📦');
                document.getElementById('pharm-drug').value = '';
                document.getElementById('pharm-delivery').value = '';
            }
        }
    </script>
</body>
</html>
