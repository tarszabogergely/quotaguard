<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Tételes Gyógyszerkezelő</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">v1.2 Gyógyszer Mestertábla</span>
            </div>
            <div id="user-info" class="text-sm text-indigo-200 hidden flex items-center space-x-4">
                <span>Bejelentkezve: <strong id="logged-user" class="text-white"></strong> (<span id="logged-role" class="underline"></span>)</span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded text-xs">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- 1. BEJELENTKEZÉS KÉPERNYŐ -->
        <div id="login-section" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 mt-12 border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">QuotaGuard Bejelentkezés</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Név (Teljes név)</label>
                    <input type="text" id="username-input" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. Dr. Tarszabó Gergely">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jelszó</label>
                    <input type="password" id="password-input" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                    Belépés a Rendszerbe
                </button>
            </div>
        </div>

        <!-- 2. OSZTÁLYI FELÜLET -->
        <div id="ward-section" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow p-6 border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <span class="mr-2">📝</span> Új gyógyszerigény leadása (<span id="ward-title-name">Osztály</span>)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg neve</label>
                        <input type="text" id="ward-patient" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Minta Béla">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg azonosító (TAJ)</label>
                        <input type="text" id="ward-patient-id" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="123 456 789">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer kiválasztása (Kvóta szerint)</label>
                        <select id="ward-drug-select" onchange="onDrugSelected()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="">-- Válasszon gyógyszert --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség & Kiszerelés</label>
                        <input type="text" id="ward-drug-details" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 text-slate-500" readonly placeholder="automatikusan kitöltődik">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Indikáció (Hivatalos protokoll)</label>
                        <input type="text" id="ward-indication" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 text-slate-500" readonly placeholder="automatikusan kitöltődik">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz / egység)</label>
                        <input type="number" id="ward-qty" class="w-full px-3 py-2 border rounded-lg text-sm" value="1" min="1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mikorra kérik?</label>
                        <input type="datetime-local" id="ward-date" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <button onclick="submitOrder()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-medium shadow">
                    Rendelés elküldése a Patikának
                </button>
            </div>
        </div>

        <!-- 3. GYÓGYSZERTÁRI FELÜLET -->
        <div id="pharmacy-section" class="hidden space-y-6">
            <!-- Új gyógyszer felvétele a törzsbe -->
            <div class="bg-white rounded-xl shadow p-6 border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <span class="mr-2">💊</span> Új gyógyszer felvétele a Mestertáblába
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve / Hatóanyag</label>
                        <input type="text" id="master-drug-name" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="pl. Regkirona / G-CSF">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség</label>
                        <input type="text" id="master-strength" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="pl. 40mg/0.4ml">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kiszerelés</label>
                        <input type="text" id="master-form" class="W-full px-3 py-2 border rounded-lg text-sm" placeholder="pl. 1 db patron">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hivatalos Indikáció</label>
                        <input type="text" id="master-indication" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Indikációs terület leírása">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jogosult Osztály</label>
                        <select id="master-ward" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="Minden osztály">Minden osztály</option>
                            <option value="Belgyógyászat">Belgyógyászat</option>
                            <option value="Hematológia">Hematológia</option>
                            <option value="Onkológia">Onkológia</option>
                            <option value="Intenzív">Intenzív Osztály</option>
                        </select>
                    </div>
                </div>
                <button onclick="saveMasterDrug()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium shadow">
                    Gyógyszer rögzítése a törzsbe
                </button>
            </div>
        </div>

    </main>

    <!-- Script -->
    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co'; // Cseréld ki a sajátodra!
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentRole = null;
        let currentWard = null;
        let loadedDrugs = [];

        async function login() {
            const nameInput = document.getElementById('username-input').value.trim();
            const passwordInput = document.getElementById('password-input').value.trim();

            if (!nameInput || !passwordInput) {
                alert('Kérlek add meg a neved és a jelszavad!');
                return;
            }

            const { data, error } = await _supabase
                .from('users')
                .select('*')
                .eq('full_name', nameInput)
                .eq('password', passwordInput)
                .single();

            if (error || !data) {
                alert('Hibás név vagy jelszó!');
                return;
            }

            currentUser = data.full_name;
            currentRole = data.role;
            currentWard = data.ward_name;

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('logged-user').innerText = currentUser;

            if (currentRole === 'ward') {
                document.getElementById('logged-role').innerText = `Osztály: ${currentWard}`;
                document.getElementById('ward-title-name').innerText = currentWard;
                document.getElementById('ward-section').classList.remove('hidden');
                loadDrugsForWard();
            } else if (currentRole === 'pharmacy') {
                document.getElementById('logged-role').innerText = 'Központi Gyógyszertár';
                document.getElementById('pharmacy-section').classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }

        // Gyógyszer törzs mentése (Gyógyszertár)
        async function saveMasterDrug() {
            const name = document.getElementById('master-drug-name').value.trim();
            const strength = document.getElementById('master-strength').value.trim();
            const form = document.getElementById('master-form').value.trim();
            const indication = document.getElementById('master-indication').value.trim();
            const ward = document.getElementById('master-ward').value;

            if (!name || !strength || !indication) {
                alert('Töltsd ki a kötelező mezőket (Név, Hatáserősség, Indikáció)!');
                return;
            }

            const { error } = await _supabase
                .from('drugs')
                .insert([{
                    drug_name: name,
                    strength: strength,
                    package_form: form,
                    approved_indication: indication,
                    allowed_ward: ward
                }]);

            if (error) {
                alert('Hiba: ' + error.message);
            } else {
                alert('Gyógyszer sikeresen rögzítve a törzsbe! 💊');
                document.getElementById('master-drug-name').value = '';
                document.getElementById('master-strength').value = '';
                document.getElementById('master-form').value = '';
                document.getElementById('master-indication').value = '';
            }
        }

        // Gyógyszerek betöltése az osztályos lenyílóba
        async function loadDrugsForWard() {
            const { data, error } = await _supabase
                .from('drugs')
                .select('*');

            if (error) {
                console.error('Hiba a gyógyszerek betöltésekor:', error);
                return;
            }

            loadedDrugs = data ||;
            const selectElem = document.getElementById('ward-drug-select');
            selectElem.innerHTML = '<option value="">-- Válasszon gyógyszert --</option>';

            loadedDrugs.forEach(drug => {
                // Szűrés: Csak azokat mutatjuk, ami az osztályé vagy "Minden osztály"
                if (drug.allowed_ward === 'Minden osztály' || drug.allowed_ward === currentWard) {
                    const opt = document.createElement('option');
                    opt.value = drug.id;
                    opt.innerText = `${drug.drug_name} (${drug.strength})`;
                    selectElem.appendChild(opt);
                }
            });
        }

        // Ha az osztály kiválaszt egy gyógyszert, automatikusan kitöltjük a részleteket
        function onDrugSelected() {
            const selectedId = document.getElementById('ward-drug-select').value;
            const drug = loadedDrugs.find(d => d.id === selectedId);

            if (drug) {
                document.getElementById('ward-drug-details').value = `${drug.strength} - ${drug.package_form}`;
                document.getElementById('ward-indication').value = drug.approved_indication;
            } else {
                document.getElementById('ward-drug-details').value = '';
                document.getElementById('ward-indication').value = '';
            }
        }

        // Rendelés leadása (Osztály)
        async function submitOrder() {
            const patientName = document.getElementById('ward-patient').value.trim();
            const patientId = document.getElementById('ward-patient-id').value.trim();
            const drugSelectId = document.getElementById('ward-drug-select').value;
            const quantity = parseInt(document.getElementById('ward-qty').value);
            const pickupDate = document.getElementById('ward-date').value;

            if (!patientName || !drugSelectId || !pickupDate) {
                alert('Kérlek töltsd ki a kötelező mezőket és válassz gyógyszert!');
                return;
            }

            const selectedDrug = loadedDrugs.find(d => d.id === drugSelectId);

            const { error } = await _supabase
                .from('orders')
                .insert([{
                    ward_name: currentWard,
                    patient_name: patientName,
                    patient_identifier: patientId,
                    drug_name: `${selectedDrug.drug_name} (${selectedDrug.strength})`,
                    indication: selectedDrug.approved_indication,
                    quantity: quantity,
                    requested_pickup_date: pickupDate,
                    status: 'pending'
                }]);

            if (error) {
                alert('Hiba: ' + error.message);
            } else {
                alert('Rendelés sikeresen elküldve a Patikának! 🛡️');
                document.getElementById('ward-patient').value = '';
                document.getElementById('ward-patient-id').value = '';
                document.getElementById('ward-drug-select').value = '';
                document.getElementById('ward-drug-details').value = '';
                document.getElementById('ward-indication').value = '';
            }
        }
    </script>
</body>
</html>
