<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Beállítások & Gyógyszertörzs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor - Aktív állapot a Beállítások oldalon -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- 1. Gyógyszer felvétele / szerkesztése űrlap -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 id="form-title" class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">💊</span> Új gyógyszer felvétele
            </h2>
            <input type="hidden" id="editing-drug-id" value="">
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve</label>
                    <input type="text" id="master-drug-name" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. MabThera">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatóanyag</label>
                    <input type="text" id="master-active-ingredient" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. Rituximab">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség (csak szám)</label>
                    <input type="text" id="master-strength" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. 500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kiszerelés (csak szám)</label>
                    <input type="text" id="master-form" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. 1">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hivatalos Indikáció</label>
                    <input type="text" id="master-indication" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. Lymphoma malignum">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jogosult Osztály(ok)</label>
                    <input type="text" id="master-ward" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Minden osztály vagy pl. Onkológia">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Vonalkód</label>
                    <input type="text" id="master-barcode" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex items-center pt-4 md:col-span-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="master-cato" class="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                        <span class="text-sm font-semibold text-slate-700">CATO kompatibilis készítmény</span>
                    </label>
                </div>
            </div>

            <div class="mt-5 flex items-center space-x-3">
                <button id="save-btn" onclick="saveMasterDrug()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium shadow-lg transition">
                    Gyógyszer rögzítése a törzsbe
                </button>
                <button id="cancel-btn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium transition">
                    Mégse / Új felvétele
                </button>
                <button id="delete-btn" onclick="deleteDrug()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow transition">
                    Törlés a törzsből
                </button>
            </div>
        </div>

        <!-- 2. Meglévő Gyógyszertörzs áttekintése -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📋</span> Gyógyszertörzs <span class="text-xs font-normal text-slate-400 ml-2">(kattints bármelyik sorra a szerkesztéshez)</span>
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Gyógyszer neve</th>
                            <th class="p-3">Hatóanyag</th>
                            <th class="p-3">Hatáserősség</th>
                            <th class="p-3">Kiszerelés</th>
                            <th class="p-3">Indikáció</th>
                            <th class="p-3">Osztály(ok)</th>
                            <th class="p-3">Vonalkód</th>
                            <th class="p-3 rounded-r-xl">CATO</th>
                        </tr>
                    </thead>
                    <tbody id="drugs-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-4 text-center text-slate-400">Törzs betöltése...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');
        let loadedDrugsMap = {};

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadDrugsTable();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function saveMasterDrug() {
            const editingId = document.getElementById('editing-drug-id').value;
            const name = document.getElementById('master-drug-name').value.trim();
            const activeIngredient = document.getElementById('master-active-ingredient').value.trim();
            const strength = document.getElementById('master-strength').value.trim();
            const form = document.getElementById('master-form').value.trim();
            const indication = document.getElementById('master-indication').value.trim();
            const ward = document.getElementById('master-ward').value.trim() || 'Minden osztály';
            const barcode = document.getElementById('master-barcode').value.trim();
            const isCato = document.getElementById('master-cato').checked;

            if (!name || !strength || !indication) {
                alert('Töltsd ki a kötelező mezőket (Név, Hatáserősség, Indikáció)!');
                return;
            }

            const drugData = {
                drug_name: name,
                active_ingredient: activeIngredient,
                strength: strength,
                package_form: form,
                approved_indication: indication,
                allowed_ward: ward,
                barcode: barcode,
                is_cato: isCato
            };

            if (editingId) {
                // Módosítás
                const { error } = await _supabase
                    .from('drugs')
                    .update(drugData)
                    .eq('id', editingId);

                if (error) {
                    alert('Hiba a módosítás során: ' + error.message);
                } else {
                    alert('Gyógyszer sikeresen frissítve! 💊');
                    resetForm();
                    loadDrugsTable();
                }
            } else {
                // Új felvétele
                const { error } = await _supabase
                    .from('drugs')
                    .insert([drugData]);

                if (error) {
                    alert('Hiba: ' + error.message);
                } else {
                    alert('Gyógyszer sikeresen rögzítve a törzsbe! 💊');
                    resetForm();
                    loadDrugsTable();
                }
            }
        }

        async function deleteDrug() {
            const editingId = document.getElementById('editing-drug-id').value;
            if (!editingId) return;

            if (!confirm('Biztosan törölni szeretnéd ezt a gyógyszert a törzsből?')) return;

            const { error } = await _supabase
                .from('drugs')
                .delete()
                .eq('id', editingId);

            if (error) {
                alert('Hiba a törlés során: ' + error.message);
            } else {
                alert('Gyógyszer törölve a törzsből.');
                resetForm();
                loadDrugsTable();
            }
        }

        function editDrug(drugId) {
            const drug = loadedDrugsMap[drugId];
            if (!drug) return;

            document.getElementById('editing-drug-id').value = drug.id;
            document.getElementById('master-drug-name').value = drug.drug_name || '';
            document.getElementById('master-active-ingredient').value = drug.active_ingredient || '';
            document.getElementById('master-strength').value = drug.strength || '';
            document.getElementById('master-form').value = drug.package_form || '';
            document.getElementById('master-indication').value = drug.approved_indication || '';
            document.getElementById('master-ward').value = drug.allowed_ward || '';
            document.getElementById('master-barcode').value = drug.barcode || '';
            document.getElementById('master-cato').checked = drug.is_cato || false;

            document.getElementById('form-title').innerHTML = '<span class="mr-2">✏️</span> Gyógyszer szerkesztése';
            document.getElementById('save-btn').innerText = 'Módosítás mentése';
            document.getElementById('cancel-btn').classList.remove('hidden');
            document.getElementById('delete-btn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editing-drug-id').value = '';
            document.getElementById('master-drug-name').value = '';
            document.getElementById('master-active-ingredient').value = '';
            document.getElementById('master-strength').value = '';
            document.getElementById('master-form').value = '';
            document.getElementById('master-indication').value = '';
            document.getElementById('master-ward').value = '';
            document.getElementById('master-barcode').value = '';
            document.getElementById('master-cato').checked = false;

            document.getElementById('form-title').innerHTML = '<span class="mr-2">💊</span> Új gyógyszer felvétele';
            document.getElementById('save-btn').innerText = 'Gyógyszer rögzítése a törzsbe';
            document.getElementById('cancel-btn').classList.add('hidden');
            document.getElementById('delete-btn').classList.add('hidden');
        }

        async function loadDrugsTable() {
            const { data, error } = await _supabase.from('drugs').select('*').order('drug_name', { ascending: true });
            const tbody = document.getElementById('drugs-table-body');
            loadedDrugsMap = {};

            if (error) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">Még nincsenek gyógyszerek a törzsben.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(drug => {
                loadedDrugsMap[drug.id] = drug;

                const catoBadge = drug.is_cato 
                    ? '<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-xs font-semibold">CATO</span>' 
                    : '<span class="text-slate-400 text-xs">-</span>';

                const strengthDisplay = drug.strength ? `${drug.strength} mg` : '-';
                const formDisplay = drug.package_form ? `${drug.package_form} x` : '-';

                const row = document.createElement('tr');
                row.className = 'hover:bg-indigo-50/50 cursor-pointer transition';
                row.onclick = () => editDrug(drug.id);
                row.innerHTML = `
                    <td class="p-3 font-semibold text-slate-900">${drug.drug_name}</td>
                    <td class="p-3 text-slate-700">${drug.active_ingredient || '-'}</td>
                    <td class="p-3 text-slate-600">${strengthDisplay}</td>
                    <td class="p-3 text-slate-600">${formDisplay}</td>
                    <td class="p-3 text-slate-500 text-xs">${drug.approved_indication}</td>
                    <td class="p-3 text-xs font-semibold text-indigo-700">${drug.allowed_ward}</td>
                    <td class="p-3 font-mono text-xs">${drug.barcode || '-'}</td>
                    <td class="p-3">${catoBadge}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
