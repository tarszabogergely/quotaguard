<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Beállítások & Gyógyszertörzs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor - Aktív állapot a Beállítások oldalon -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- 1. Új gyógyszer felvétele a törzsbe (CATO & Vonalkóddal) -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">💊</span> Új gyógyszer felvétele
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve / Hatóanyag</label>
                    <input type="text" id="master-drug-name" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség</label>
                    <input type="text" id="master-strength" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kiszerelés</label>
                    <input type="text" id="master-form" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hivatalos Indikáció</label>
                    <input type="text" id="master-indication" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jogosult Osztály</label>
                    <select id="master-ward" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Minden osztály">Minden osztály</option>
                        <option value="Belgyógyászat">Belgyógyászat</option>
                        <option value="Hematológia">Hematológia</option>
                        <option value="Onkológia">Onkológia</option>
                        <option value="Intenzív">Intenzív Osztály</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Vonalkód</label>
                    <input type="text" id="master-barcode" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex items-center pt-6">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="master-cato" class="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                        <span class="text-sm font-semibold text-slate-700">CATO kompatibilis készítmény</span>
                    </label>
                </div>
            </div>
            <button onclick="saveMasterDrug()" class="mt-5 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium shadow-lg transition">
                Gyógyszer rögzítése a törzsbe
            </button>
        </div>

        <!-- 2. Meglévő Gyógyszertörzs áttekintése -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📋</span> Gyógyszertörzs
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Gyógyszer neve</th>
                            <th class="p-3">Hatás / Kiszerelés</th>
                            <th class="p-3">Indikáció</th>
                            <th class="p-3">Vonalkód</th>
                            <th class="p-3">CATO</th>
                            <th class="p-3 rounded-r-xl">Osztály</th>
                        </tr>
                    </thead>
                    <tbody id="drugs-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="6" class="p-4 text-center text-slate-400">Törzs betöltése...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadDrugsTable();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function saveMasterDrug() {
            const name = document.getElementById('master-drug-name').value.trim();
            const strength = document.getElementById('master-strength').value.trim();
            const form = document.getElementById('master-form').value.trim();
            const indication = document.getElementById('master-indication').value.trim();
            const ward = document.getElementById('master-ward').value;
            const barcode = document.getElementById('master-barcode').value.trim();
            const isCato = document.getElementById('master-cato').checked;

            if (!name || !strength || !indication) {
                alert('Töltsd ki a kötelező mezőket (Név, Hatáserősség, Indikáció)!');
                return;
            }

            const { error } = await _supabase
                .from('drugs')
                .insert([{
                    drug_name: name,
                    strength: strength,
                    package_form: form,
                    approved_indication: indication,
                    allowed_ward: ward,
                    barcode: barcode,
                    is_cato: isCato
                }]);

            if (error) {
                alert('Hiba: ' + error.message);
            } else {
                alert('Gyógyszer sikeresen rögzítve a törzsbe! 💊');
                document.getElementById('master-drug-name').value = '';
                document.getElementById('master-strength').value = '';
                document.getElementById('master-form').value = '';
                document.getElementById('master-indication').value = '';
                document.getElementById('master-barcode').value = '';
                document.getElementById('master-cato').checked = false;
                loadDrugsTable();
            }
        }

        async function loadDrugsTable() {
            const { data, error } = await _supabase.from('drugs').select('*').order('drug_name', { ascending: true });
            const tbody = document.getElementById('drugs-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Még nincsenek gyógyszerek a törzsben.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(drug => {
                const catoBadge = drug.is_cato 
                    ? '<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-xs font-semibold">CATO</span>' 
                    : '<span class="text-slate-400 text-xs">-</span>';

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="p-3 font-medium">${drug.drug_name}</td>
                    <td class="p-3 text-slate-600">${drug.strength} (${drug.package_form})</td>
                    <td class="p-3 text-slate-500 text-xs">${drug.approved_indication}</td>
                    <td class="p-3 font-mono text-xs">${drug.barcode || '-'}</td>
                    <td class="p-3">${catoBadge}</td>
                    <td class="p-3 text-xs font-semibold text-indigo-700">${drug.allowed_ward}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
