<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Adatbázisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-4">
            <!-- Címsor, Szűrő csúszka és Keresősáv -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 flex items-center">
                        <span class="mr-2">🗄️</span> Adatbázis
                    </h2>
                </div>

                <!-- Bal oldali nézetválasztó csúszka és jobb oldali kereső -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <!-- Stílusos nézetválasztó csúszka -->
                    <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200 text-xs font-medium">
                        <button id="filter-pending-btn" onclick="setFilterMode('pending')" class="px-3 py-1.5 rounded-lg transition bg-indigo-600 text-white shadow-sm">
                            Jelentésre vár
                        </button>
                        <button id="filter-all-btn" onclick="setFilterMode('all')" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900">
                            Teljes lista
                        </button>
                    </div>

                    <!-- Globális kereső -->
                    <div class="w-full md:w-64">
                        <input type="text" id="global-search" oninput="filterDatabaseTable()" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="🔍">
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Azonosító</th>
                            <th class="p-3">Osztály</th>
                            <th class="p-3">Beteg neve</th>
                            <th class="p-3">TAJ szám</th>
                            <th class="p-3">Gyógyszer</th>
                            <th class="p-3">Mennyiség</th>
                            <th class="p-3">Jelentési státusz</th>
                            <th class="p-3 rounded-r-xl text-right">Művelet</th>
                        </tr>
                    </thead>
                    <tbody id="database-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-4 text-center text-slate-400">Adatbázis betöltése...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');
        let rawDatabaseOrders = [];
        let currentFilterMode = 'pending'; // Alapértelmezett nézet: Jelentésre vár

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadDispensedDatabase();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Nézetváltó csúszka logika
        function setFilterMode(mode) {
            currentFilterMode = mode;
            const btnPending = document.getElementById('filter-pending-btn');
            const btnAll = document.getElementById('filter-all-btn');

            if (mode === 'pending') {
                btnPending.className = "px-3 py-1.5 rounded-lg transition bg-indigo-600 text-white shadow-sm";
                btnAll.className = "px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900";
            } else {
                btnAll.className = "px-3 py-1.5 rounded-lg transition bg-indigo-600 text-white shadow-sm";
                btnPending.className = "px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900";
            }

            filterDatabaseTable();
        }

        async function loadDispensedDatabase() {
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .in('status', ['dispensed', 'reported'])
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('database-table-body').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            rawDatabaseOrders = data || [];
            filterDatabaseTable();
        }

        function renderTable(dataToRender) {
            const tbody = document.getElementById('database-table-body');

            if (!dataToRender || dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">Nincs a feltételeknek megfelelő tétel az adatbázisban.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            dataToRender.forEach(item => {
                let statusBadge = '';
                if (item.status === 'dispensed') {
                    statusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">Kiadva</span>';
                } else if (item.status === 'reported') {
                    statusBadge = '<span class="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full text-xs font-semibold">Jelentés kész ✓</span>';
                }

                let actionBtn = item.status === 'dispensed'
                    ? `<button onclick="markAsReported('${item.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium shadow transition">Jelentés kész</button>`
                    : `<span class="text-xs text-slate-400 italic">Lezárva</span>`;

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">
                        ${new Date(item.created_at).toLocaleDateString('hu-HU')}<br>
                        <strong class="font-mono text-indigo-900">${item.order_batch_id || '-'}</strong>
                    </td>
                    <td class="p-3 font-medium text-slate-700">${item.ward_name}</td>
                    <td class="p-3 font-semibold text-slate-900">${item.patient_name}</td>
                    <td class="p-3 font-mono text-xs text-slate-600">${item.patient_identifier || '-'}</td>
                    <td class="p-3">
                        ${item.drug_name}
                        ${item.delivery_note_number ? `<br><span class="text-[10px] text-slate-500 font-mono">Sz.lev: ${item.delivery_note_number} \vert{} Gy.sz:${item.batch_number || '-'}</span>` : ''}
                    </td>
                    <td class="p-3 font-semibold">${item.quantity} doboz</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 text-right">${actionBtn}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Szűrés a csúszka (mód) és a globális keresőmező alapján egyszerre
        function filterDatabaseTable() {
            const query = document.getElementById('global-search').value.toLowerCase().trim();

            let filtered = rawDatabaseOrders.filter(item => {
                // Csúszka szerinti szűrés
                if (currentFilterMode === 'pending' && item.status !== 'dispensed') {
                    return false;
                }
                return true;
            });

            // Ha van szöveges keresés is
            if (query) {
                filtered = filtered.filter(item => {
                    const textToSearch = `
                        ${item.order_batch_id || ''} 
                        ${item.ward_name || ''} 
                        ${item.patient_name || ''} 
                        ${item.patient_identifier || ''} 
                        ${item.drug_name || ''} 
                        ${item.delivery_note_number || ''} 
                        ${item.batch_number || ''} 
                        ${item.status || ''}
                    `.toLowerCase();

                    return textToSearch.includes(query);
                });
            }

            renderTable(filtered);
        }

        async function markAsReported(orderId) {
            const { error } = await _supabase
                .from('orders')
                .update({ status: 'reported' })
                .eq('id', orderId);

            if (error) {
                alert('Hiba történt a státusz frissítésekor: ' + error.message);
            } else {
                alert('Jelentés sikeresen rögzítve! A státusz frissült. ✓');
                loadDispensedDatabase();
            }
        }
    </script>
</body>
</html>
