<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Készlet & Bevételezés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Gyógyszertári menüsor -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition">Beérkező rendelések</a>
                <a href="pharmacy-inventory.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow">Bevétel & Készlet</a>
                <a href="pharmacy-settings.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- 1. Új szállítmány bevételezése -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📦</span> Új szállítmány bevételezése (Szállítólevél alapján)
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer kiválasztása (Törzsből)</label>
                    <select id="receipt-drug-select" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Válasszon gyógyszert --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Szállítólevél száma</label>
                    <input type="text" id="receipt-delivery" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="SZ-2026/001">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz / egység)</label>
                    <input type="number" id="receipt-qty" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="10" min="1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lejárati dátum</label>
                    <input type="date" id="receipt-expiry" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
            <button onclick="saveReceipt()" class="mt-5 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium shadow-lg transition">
                Bevételezés rögzítése (FIFO) 📦
            </button>
        </div>

        <!-- 2. Aktuális raktárkészlet -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📊</span> Aktuális Raktárkészlet (FIFO tételenként)
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Bevételezve</th>
                            <th class="p-3">Gyógyszer neve</th>
                            <th class="p-3">Szállítólevél</th>
                            <th class="p-3">Kezdeti / Aktuális készlet</th>
                            <th class="p-3 rounded-r-xl">Lejárati idő</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">Készlet betöltése...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');
        let loadedMasterDrugs = [];

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadMasterDrugs();
            loadInventory();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadMasterDrugs() {
            const { data, error } = await _supabase.from('drugs').select('*');
            if (error) {
                console.error('Hiba a gyógyszertörzs betöltésekor:', error);
                return;
            }

            loadedMasterDrugs = data || [];
            const selectElem = document.getElementById('receipt-drug-select');
            selectElem.innerHTML = '<option value="">-- Válasszon gyógyszert --</option>';

            loadedMasterDrugs.forEach(drug => {
                const opt = document.createElement('option');
                opt.value = drug.id;
                opt.innerText = `${drug.drug_name} (${drug.strength} - ${drug.package_form})`;
                selectElem.appendChild(opt);
            });
        }

        async function saveReceipt() {
            const drugId = document.getElementById('receipt-drug-select').value;
            const deliveryNote = document.getElementById('receipt-delivery').value.trim();
            const qty = parseInt(document.getElementById('receipt-qty').value);
            const expiryDate = document.getElementById('receipt-expiry').value;

            if (!drugId || !deliveryNote || !expiryDate || isNaN(qty)) {
                alert('Kérlek válassz gyógyszert a listából, és töltsd ki az összes mezőt!');
                return;
            }

            const selectedDrug = loadedMasterDrugs.find(d => d.id === drugId);
            const fullDrugName = `${selectedDrug.drug_name} (${selectedDrug.strength})`;

            const { error } = await _supabase
                .from('inventory_receipts')
                .insert([{
                    drug_name: fullDrugName,
                    delivery_note_number: deliveryNote,
                    initial_quantity: qty,
                    current_quantity: qty,
                    expiry_date: expiryDate
                }]);

            if (error) {
                alert('Hiba a bevételezéskor: ' + error.message);
            } else {
                alert('Szállítmány sikeresen bevételezve a törzsből! 📦');
                document.getElementById('receipt-drug-select').value = '';
                document.getElementById('receipt-delivery').value = '';
                document.getElementById('receipt-qty').value = '10';
                document.getElementById('receipt-expiry').value = '';
                loadInventory();
            }
        }

        async function loadInventory() {
            const { data, error } = await _supabase
                .from('inventory_receipts')
                .select('*')
                .order('expiry_date', { ascending: true });

            const tbody = document.getElementById('inventory-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">A raktárkészlet jelenleg üres.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(item => {
                let qtyBadge = item.current_quantity > 0 
                    ? `<span class="font-semibold text-slate-800">${item.current_quantity}</span> / <span class="text-slate-400">${item.initial_quantity} doboz</span>`
                    : `<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs font-semibold">Elfogyott (0)</span>`;

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">${new Date(item.created_at).toLocaleDateString('hu-HU')}</td>
                    <td class="p-3 font-medium">${item.drug_name}</td>
                    <td class="p-3 text-slate-600">${item.delivery_note_number}</td>
                    <td class="p-3">${qtyBadge}</td>
                    <td class="p-3 text-slate-600 text-xs font-semibold">${item.expiry_date}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
