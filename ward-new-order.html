<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Új rendelés feladása</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span id="ward-badge" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Osztály</span>
            </div>
            <!-- Osztály menüsor -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800">
                <a href="ward-new-order.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow">Új rendelés</a>
                <a href="ward-my-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Korábbi rendeléseim</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100 mt-4">
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center">
                <span class="mr-2">📝</span> Új gyógyszerigény leadása
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg neve</label>
                    <input type="text" id="ward-patient" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Minta Béla">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Beteg azonosító (TAJ)</label>
                    <input type="text" id="ward-patient-id" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="123 456 789">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer kiválasztása (Kvóta szerint)</label>
                    <select id="ward-drug-select" onchange="onDrugSelected()" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Válasszon gyógyszert --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség & Kiszerelés</label>
                    <input type="text" id="ward-drug-details" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-500" readonly placeholder="automatikusan kitöltődik">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Indikáció (Hivatalos protokoll)</label>
                    <input type="text" id="ward-indication" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 text-slate-500" readonly placeholder="automatikusan kitöltődik">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz / egység)</label>
                    <input type="number" id="ward-qty" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="1" min="1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mikorra kérik?</label>
                    <input type="datetime-local" id="ward-date" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
            <button onclick="submitOrder()" class="mt-6 w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl text-sm font-medium shadow-lg transition">
                Rendelés elküldése a Patikának 🛡️
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentWard = localStorage.getItem('qg_ward');
        let loadedDrugs = [];

        // Jogosultság ellenőrzés betöltéskor
        if (!currentUser || localStorage.getItem('qg_role') !== 'ward') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            document.getElementById('ward-badge').innerText = currentWard;
            loadDrugsForWard();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDrugsForWard() {
            const { data, error } = await _supabase.from('drugs').select('*');
            if (error) {
                console.error('Hiba:', error);
                return;
            }

            loadedDrugs = data || [];
            const selectElem = document.getElementById('ward-drug-select');
            selectElem.innerHTML = '<option value="">-- Válasszon gyógyszert --</option>';

            loadedDrugs.forEach(drug => {
                if (drug.allowed_ward === 'Minden osztály' || drug.allowed_ward === currentWard) {
                    const opt = document.createElement('option');
                    opt.value = drug.id;
                    opt.innerText = `${drug.drug_name} (${drug.strength})`;
                    selectElem.appendChild(opt);
                }
            });
        }

        function onDrugSelected() {
            const selectedId = document.getElementById('ward-drug-select').value;
            const drug = loadedDrugs.find(d => d.id === selectedId);

            if (drug) {
                document.getElementById('ward-drug-details').value = `${drug.strength} - ${drug.package_form}`;
                document.getElementById('ward-indication').value = drug.approved_indication;
            } else {
                document.getElementById('ward-drug-details').value = '';
                document.getElementById('ward-indication').value = '';
            }
        }

        async function submitOrder() {
            const patientName = document.getElementById('ward-patient').value.trim();
            const patientId = document.getElementById('ward-patient-id').value.trim();
            const drugSelectId = document.getElementById('ward-drug-select').value;
            const quantity = parseInt(document.getElementById('ward-qty').value);
            const pickupDate = document.getElementById('ward-date').value;

            if (!patientName || !drugSelectId || !pickupDate) {
                alert('Kérlek töltsd ki a kötelező mezőket és válassz gyógyszert!');
                return;
            }

            const selectedDrug = loadedDrugs.find(d => d.id === drugSelectId);

            const { error } = await _supabase
                .from('orders')
                .insert([{
                    ward_name: currentWard,
                    patient_name: patientName,
                    patient_identifier: patientId,
                    drug_name: `${selectedDrug.drug_name} (${selectedDrug.strength})`,
                    indication: selectedDrug.approved_indication,
                    quantity: quantity,
                    requested_pickup_date: pickupDate,
                    status: 'pending'
                }]);

            if (error) {
                alert('Hiba: ' + error.message);
            } else {
                alert('Rendelés sikeresen elküldve a Patikának! 🛡️');
                document.getElementById('ward-patient').value = '';
                document.getElementById('ward-patient-id').value = '';
                document.getElementById('ward-drug-select').value = '';
                document.getElementById('ward-drug-details').value = '';
                document.getElementById('ward-indication').value = '';
            }
        }
    </script>
</body>
</html>
