<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Új rendelés feladása</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span id="ward-badge" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Osztály</span>
            </div>
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800">
                <a href="ward-new-order.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow">Új rendelés</a>
                <a href="ward-my-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Korábbi rendeléseim</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100 mt-4 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 class="text-xl font-bold text-slate-900 flex items-center">
                    <span class="mr-2">📝</span> Új gyógyszerigény leadása
                </h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mikorra kérik az átvételt?</label>
                    <input type="datetime-local" id="global-pickup-date" class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Itt gyűlnek a gyógyszer blokkok -->
            <div id="drug-blocks-container" class="space-y-6">
                <!-- A dinamikus blokkok ide kerülnek -->
            </div>

            <!-- Új gyógyszer választása gomb -->
            <div>
                <button onclick="addDrugBlock()" class="w-full py-3.5 border-2 border-dashed border-indigo-300 hover:border-indigo-500 text-indigo-700 hover:bg-indigo-50 rounded-2xl text-sm font-semibold transition flex items-center justify-center space-x-2 shadow-sm">
                    <span class="text-lg">＋</span>
                    <span>Új gyógyszer választása</span>
                </button>
            </div>

            <!-- Küldés gomb -->
            <div class="pt-4 border-t">
                <button onclick="submitOrders()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl text-base font-semibold shadow-lg transition flex items-center justify-center space-x-2">
                    <span>Rendelés elküldése a Patikának</span>
                    <span>🛡️</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentWard = localStorage.getItem('qg_ward');
        let loadedDrugs = [];

        if (!currentUser || localStorage.getItem('qg_role') !== 'ward') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            document.getElementById('ward-badge').innerText = currentWard;
            
            // Alapértelmezett dátum beállítása holnapra
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(8, 0, 0, 0);
            document.getElementById('global-pickup-date').value = tomorrow.toISOString().slice(0, 16);

            loadDrugsForWard();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadDrugsForWard() {
            const { data, error } = await _supabase.from('drugs').select('*');
            if (error) {
                console.error('Hiba:', error);
                return;
            }

            loadedDrugs = data || [];
            // Indításkor létrehozunk egy alap gyógyszer blokkot
            addDrugBlock();
        }

        // Új gyógyszer blokk hozzáadása
        function addDrugBlock() {
            const container = document.getElementById('drug-blocks-container');
            const blockIndex = document.querySelectorAll('.drug-block').length;

            let optionsHtml = '<option value="">-- Válasszon gyógyszert --</option>';
            loadedDrugs.forEach(drug => {
                if (drug.allowed_ward === 'Minden osztály' || drug.allowed_ward === currentWard) {
                    optionsHtml += `<option value="${drug.id}">${drug.drug_name} (${drug.strength})</option>`;
                }
            });

            const blockDiv = document.createElement('div');
            blockDiv.className = 'drug-block bg-slate-50 border border-slate-200 rounded-2xl p-5 relative space-y-4 shadow-sm';
            blockDiv.dataset.index = blockIndex;

            let deleteBtnHtml = blockIndex > 0 ? `
                <button onclick="removeDrugBlock(this)" class="absolute top-4 right-4 text-red-500 hover:text-red-700 bg-white border border-red-200 px-3 py-1 rounded-xl text-xs font-semibold shadow-sm transition">
                    Törlés ✕
                </button>` : '';

            blockDiv.innerHTML = `
                ${deleteBtnHtml}
                <div class="font-bold text-xs uppercase text-indigo-900 tracking-wider">Gyógyszer tétel #${blockIndex + 1}</div>
                
                <!-- Gyógyszer adatok (Fókuszban) -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gyógyszer neve *</label>
                        <select class="drug-select w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" onchange="onDrugChange(this)">
                            ${optionsHtml}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hatáserősség & Kiszerelés</label>
                        <input type="text" class="drug-details w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-slate-100 text-slate-500" readonly placeholder="automata">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mennyiség (doboz) *</label>
                        <input type="number" class="drug-qty w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="1" min="1">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Indikáció (Hivatalos protokoll)</label>
                        <input type="text" class="drug-indication w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-slate-100 text-slate-500" readonly placeholder="automata">
                    </div>
                </div>

                <!-- Beteg adatok sora(k) -->
                <div class="border-t pt-3 space-y-2">
                    <div class="text-xs font-semibold text-slate-700 uppercase">Beteg adatok</div>
                    <div class="patients-container space-y-2">
                        <div class="patient-row flex items-center gap-2">
                            <input type="text" class="patient-name flex-2 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Beteg neve *">
                            <input type="text" class="patient-id flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="TAJ szám (opcionális)">
                            <button type="button" onclick="removePatientRow(this)" class="px-3 py-2 text-slate-400 hover:text-red-500 text-sm" style="visibility: hidden;">✕</button>
                        </div>
                    </div>
                    <button type="button" onclick="addPatientRow(this)" class="mt-1 text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center space-x-1">
                        <span>＋ Új beteg hozzáadása ehhez a gyógyszerhez</span>
                    </button>
                </div>
            `;

            container.appendChild(blockDiv);
        }

        function removeDrugBlock(btn) {
            btn.closest('.drug-block').remove();
        }

        function addPatientRow(btn) {
            const container = btn.previousElementSibling;
            const newRow = document.createElement('div');
            newRow.className = 'patient-row flex items-center gap-2';
            newRow.innerHTML = `
                <input type="text" class="patient-name flex-2 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Beteg neve *">
                <input type="text" class="patient-id flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="TAJ szám (opcionális)">
                <button type="button" onclick="removePatientRow(this)" class="px-3 py-2 text-slate-400 hover:text-red-500 text-sm">✕</button>
            `;
            container.appendChild(newRow);
            
            // Ha egynél több sor van, minden sornál látszódjon a törlés gomb
            const rows = container.querySelectorAll('.patient-row');
            rows.forEach((r, idx) => {
                const delBtn = r.querySelector('button');
                delBtn.style.visibility = idx === 0 && rows.length === 1 ? 'hidden' : 'visible';
            });
        }

        function removePatientRow(btn) {
            const row = btn.closest('.patient-row');
            const container = row.parentElement;
            row.remove();

            const rows = container.querySelectorAll('.patient-row');
            if (rows.length === 1) {
                rows[0].querySelector('button').style.visibility = 'hidden';
            }
        }

        function onDrugChange(selectElem) {
            const block = selectElem.closest('.drug-block');
            const drugId = selectElem.value;
            const drug = loadedDrugs.find(d => d.id === drugId);

            if (drug) {
                block.querySelector('.drug-details').value = `${drug.strength} - ${drug.package_form}`;
                block.querySelector('.drug-indication').value = drug.approved_indication;
            } else {
                block.querySelector('.drug-details').value = '';
                block.querySelector('.drug-indication').value = '';
            }
        }

        async function submitOrders() {
            const pickupDate = document.getElementById('global-pickup-date').value;
            if (!pickupDate) {
                alert('Kérlek add meg az átvétel időpontját!');
                return;
            }

            const drugBlocks = document.querySelectorAll('.drug-block');
            const ordersToInsert = [];

            for (let block of drugBlocks) {
                const drugSelectId = block.querySelector('.drug-select').value;
                const qty = parseInt(block.querySelector('.drug-qty').value);

                if (!drugSelectId) {
                    alert('Minden blokkban ki kell választani egy gyógyszert!');
                    return;
                }

                const selectedDrug = loadedDrugs.find(d => d.id === drugSelectId);
                const patientRows = block.querySelectorAll('.patient-row');

                for (let prow of patientRows) {
                    const pName = prow.querySelector('.patient-name').value.trim();
                    const pId = prow.querySelector('.patient-id').value.trim();

                    if (!pName) {
                        alert('A beteg neve minden sorban kötelező!');
                        return;
                    }

                    ordersToInsert.push({
                        ward_name: currentWard,
                        patient_name: pName,
                        patient_identifier: pId || null,
                        drug_name: `${selectedDrug.drug_name} (${selectedDrug.strength})`,
                        indication: selectedDrug.approved_indication,
                        quantity: isNaN(qty) ? 1 : qty,
                        requested_pickup_date: pickupDate,
                        status: 'pending'
                    });
                }
            }

            if (ordersToInsert.length === 0) {
                alert('Nincs mit elküldeni!');
                return;
            }

            const { error } = await _supabase.from('orders').insert(ordersToInsert);

            if (error) {
                alert('Hiba a rendelés mentésekor: ' + error.message);
            } else {
                alert('Rendelések sikeresen elküldve a Patikának! 🛡️');
                window.location.href = 'ward-my-orders.html';
            }
        }
    </script>
</body>
</html>
