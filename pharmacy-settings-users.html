<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Felhasználók kezelése</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor - Aktív állapot a Beállítások oldalon -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Vissza a Beállítások főmenühöz -->
        <div class="flex items-center justify-between">
            <a href="pharmacy-settings.html" class="inline-flex items-center space-x-2 text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-white border border-indigo-100 hover:border-indigo-300 px-4 py-2 rounded-xl shadow-sm transition">
                <span>← Vissza a Beállítások főmenühöz</span>
            </a>
        </div>

        <!-- 1. Új felhasználó felvétele / Szerkesztés űrlap -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 id="form-title" class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">👤</span> Új felhasználó rögzítése
            </h2>
            <input type="hidden" id="edit-user-id">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Felhasználónév / Név</label>
                    <input type="text" id="user-name" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="pl. Dr. Kovács Anna">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Osztály vagy Csatolás</label>
                    <select id="user-ward" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Központi Gyógyszertár">Központi Gyógyszertár (Admin)</option>
                        <option value="Belgyógyászat">Belgyógyászat</option>
                        <option value="Hematológia">Hematológia</option>
                        <option value="Onkológia">Onkológia</option>
                        <option value="Intenzív">Intenzív Osztály</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Szerepkör</label>
                    <select id="user-role" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="ward">Osztályos felhasználó</option>
                        <option value="pharmacy">Patikai operátor</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jelszó</label>
                    <div class="relative">
                        <input type="password" id="user-password" class="w-full px-3.5 py-2.5 pr-10 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="******">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600 text-sm">
                            <span id="password-eye-icon">👁️</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3 mt-5">
                <button onclick="saveUser()" id="save-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium shadow-lg transition">
                    Felhasználó mentése 💾
                </button>
                <button onclick="resetForm()" id="cancel-btn" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium transition">
                    Mégse
                </button>
            </div>
        </div>

        <!-- 2. Meglévő Felhasználók listája -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">👥</span> Rendszer felhasználói
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Név / Felhasználónév</th>
                            <th class="p-3">Osztály / Terület</th>
                            <th class="p-3">Szerepkör</th>
                            <th class="p-3">Jelszó</th>
                            <th class="p-3 rounded-r-xl text-right">Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">Felhasználók betöltése...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadUsersTable();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Jelszó láthatóság váltása a szem ikonnal
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('user-password');
            const eyeIcon = document.getElementById('password-eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerText = '🙈';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        }

        // Lista betöltése a Supabase-ből
        async function loadUsersTable() {
            const { data, error } = await _supabase.from('users').select('*').order('username', { ascending: true });
            const tbody = document.getElementById('users-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Még nincsenek rögzített felhasználók.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(user => {
                const roleBadge = user.role === 'pharmacy' 
                    ? '<span class="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full text-xs font-semibold">Patika Operátor</span>' 
                    : '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">Osztály</span>';

                // Maszkolt jelszó megjelenítés csillagokkal
                const maskedPassword = '••••••';

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="p-3 font-semibold text-slate-900">${user.username}</td>
                    <td class="p-3 text-slate-700">${user.ward || 'Központ'}</td>
                    <td class="p-3">${roleBadge}</td>
                    <td class="p-3 font-mono text-slate-500 text-xs">${maskedPassword}</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="editUser('${user.id}', '${user.username}', '${user.ward || ''}', '${user.role}', '${user.password}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-xl text-xs font-medium transition">Szerkesztés</button>
                        <button onclick="deleteUser('${user.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-xs font-medium transition">Törlés</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Felhasználó mentése (Új létrehozása vagy meglévő szerkesztése)
        async function saveUser() {
            const editId = document.getElementById('edit-user-id').value;
            const username = document.getElementById('user-name').value.trim();
            const ward = document.getElementById('user-ward').value;
            const role = document.getElementById('user-role').value;
            const password = document.getElementById('user-password').value.trim();

            if (!username || !password) {
                alert('A felhasználónév és a jelszó megadása kötelező!');
                return;
            }

            if (editId) {
                // Frissítés
                const { error } = await _supabase
                    .from('users')
                    .update({ username, ward, role, password })
                    .eq('id', editId);

                if (error) {
                    alert('Hiba a szerkesztéskor: ' + error.message);
                } else {
                    alert('Felhasználó sikeresen frissítve! ✓');
                    resetForm();
                    loadUsersTable();
                }
            } else {
                // Új beszúrása
                const { error } = await _supabase
                    .from('users')
                    .insert([{ username, ward, role, password }]);

                if (error) {
                    alert('Hiba a rögzítéskor: ' + error.message);
                } else {
                    alert('Új felhasználó sikeresen rögzítve! 👤');
                    resetForm();
                    loadUsersTable();
                }
            }
        }

        // Szerkesztési mód betöltése az űrlapba
        function editUser(id, username, ward, role, password) {
            document.getElementById('edit-user-id').value = id;
            document.getElementById('user-name').value = username;
            document.getElementById('user-ward').value = ward || 'Központi Gyógyszertár';
            document.getElementById('user-role').value = role;
            document.getElementById('user-password').value = password;

            document.getElementById('form-title').innerHTML = `<span class="mr-2">✏️</span> Felhasználó szerkesztése: ${username}`;
            document.getElementById('save-btn').innerText = 'Módosítások mentése';
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Form alaphelyzetbe állítása
        function resetForm() {
            document.getElementById('edit-user-id').value = '';
            document.getElementById('user-name').value = '';
            document.getElementById('user-ward').value = 'Központi Gyógyszertár';
            document.getElementById('user-role').value = 'ward';
            document.getElementById('user-password').value = '';

            document.getElementById('form-title').innerHTML = `<span class="mr-2">👤</span> Új felhasználó rögzítése`;
            document.getElementById('save-btn').innerText = 'Felhasználó mentése 💾';
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        // Törlés
        async function deleteUser(id) {
            if (!confirm('Biztosan törölni szeretnéd ezt a felhasználót?')) return;

            const { error } = await _supabase.from('users').delete().eq('id', id);
            if (error) {
                alert('Hiba törlés közben: ' + error.message);
            } else {
                alert('Felhasználó törölve.');
                loadUsersTable();
            }
        }
    </script>
</body>
</html>
