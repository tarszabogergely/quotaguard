<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Csomagalapú Rendelések</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Speciális 8x4 cm-es címke nyomtatási stílus */
        @media print {
            body.print-labels @page {
                size: 8cm 4cm;
                margin: 0;
            }
            body.print-labels, body.print-labels html {
                width: 8cm;
                height: 4cm;
                margin: 0;
                padding: 0;
                background: white !important;
            }
            body.print-labels * { visibility: hidden; }
            body.print-labels #print-labels-container, body.print-labels #print-labels-container * { visibility: visible; }
            body.print-labels #print-labels-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 8cm;
                display: block;
            }
            body.print-labels .drug-label {
                width: 8cm;
                height: 4cm;
                page-break-after: always;
                page-break-inside: avoid;
                box-sizing: border-box;
                padding: 3mm;
                font-family: sans-serif;
                font-size: 9pt;
                line-height: 1.15;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: white;
            }

            /* A4-es Összesítő nyomtatási stílus */
            body.print-a4 * { visibility: hidden; }
            body.print-a4 #print-summary-container, body.print-a4 #print-summary-container * { visibility: visible; }
            body.print-a4 #print-summary-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 15mm;
                box-sizing: border-box;
                font-family: sans-serif;
                color: #000;
                background: white !important;
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor - Fókusz fixálással -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Aktív Csomagok Listája -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📥</span> Beérkezett rendelések
            </h2>
            <div id="active-packages-container" class="space-y-4">
                <div class="p-6 text-center text-slate-400">Csomagok betöltése...</div>
            </div>
        </div>

        <!-- Korábbi teljesített csomagok -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <span class="mr-2">📚</span> Kiadott gyógyszerek
            </h2>
            <div id="completed-packages-container" class="space-y-4">
                <div class="p-6 text-center text-slate-400">Archívum betöltése...</div>
            </div>
        </div>

    </main>

    <!-- Rejtett konténerek a nyomtatáshoz -->
    <div id="print-labels-container" class="hidden"></div>
    <div id="print-summary-container" class="hidden"></div>

    <!-- Részletek / Szerkesztés & Nyomtatás Modális Ablak -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Csomag részletei & Szerkesztése</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
            </div>
            
            <div id="modal-content" class="space-y-4 text-sm">
                <!-- Dinamikus tartalom -->
            </div>

            <div class="border-t pt-4 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-2">
                    <button onclick="printA4Summary()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-medium shadow transition">🖨️ Összesítő nyomtatása</button>
                    <button onclick="printBoxLabels()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-medium shadow transition">🏷️ Dobozcímkék nyomtatása</button>
                </div>
                <div id="modal-action-buttons" class="flex items-center space-x-2">
                    <!-- Dinamikus gombok -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');
        let allOrdersData = [];
        let activeBatchIdModal = null;

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadPharmacyPackages();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadPharmacyPackages() {
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Hiba:', error);
                return;
            }

            allOrdersData = data || [];
            
            const batches = {};
            allOrdersData.forEach(order => {
                const bId = order.order_batch_id || ('ID-' + order.id.slice(0, 8));
                if (!batches[bId]) {
                    batches[bId] = {
                        batchId: bId,
                        ward: order.ward_name,
                        createdAt: order.created_at,
                        pickupDate: order.requested_pickup_date,
                        status: order.status,
                        orderedBy: order.ordered_by || 'Ismeretlen feladó',
                        assembledBy: order.assembled_by || 'Még nincs összeállítva',
                        items: []
                    };
                }
                if (order.status === 'pending') batches[bId].status = 'pending';
                batches[bId].items.push(order);
            });

            const activeContainer = document.getElementById('active-packages-container');
            const completedContainer = document.getElementById('completed-packages-container');

            activeContainer.innerHTML = '';
            completedContainer.innerHTML = '';

            let activeCount = 0;
            let completedCount = 0;

            Object.values(batches).forEach(batch => {
                let validItems = batch.items.filter(i => i.quantity > 0 && !i.patient_name.includes('[TÖRÖLVE]'));
                let totalBoxes = validItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
                let patientsCount = new Set(validItems.map(i => i.patient_name)).size;

                let pendingReportCount = validItems.filter(i => i.status !== 'reported').length;
                let allReported = pendingReportCount === 0 && validItems.length > 0;

                let hasDispensed = batch.items.some(i => i.status === 'dispensed' || i.status === 'reported');
                let hasAssembled = batch.items.some(i => i.status === 'assembled');

                let statusBadge = '';
                if (hasDispensed || allReported && batch.status === 'dispensed') {
                    statusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">Kiadva</span>';
                } else if (hasAssembled) {
                    statusBadge = '<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-semibold">Összeállítás alatt</span>';
                } else {
                    statusBadge = '<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-xs font-semibold">Függőben</span>';
                }

                let reportIndicatorHtml = '';
                if (allReported) {
                    reportIndicatorHtml = `
                        <div class="flex items-center space-x-1 text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">
                            <span class="text-lg font-bold">✓</span>
                            <span class="text-xs font-semibold">Minden jelentve</span>
                        </div>
                    `;
                } else {
                    reportIndicatorHtml = `
                        <div class="flex items-center space-x-2 bg-red-50 px-3 py-1.5 rounded-xl border border-red-200 text-right">
                            <span class="text-red-600 font-bold text-base">✕</span>
                            <div class="text-[11px] leading-tight">
                                <span class="text-red-700 font-semibold block">Nem jelentve:</span>
                                <span class="text-red-900 font-bold">${pendingReportCount} tétel</span>
                            </div>
                        </div>
                    `;
                }

                const cardHtml = `
                    <div class="bg-slate-50 border border-slate-200 hover:border-indigo-300 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition shadow-sm cursor-pointer" onclick="openBatchModal('${batch.batchId}')">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-mono font-bold text-indigo-900">${batch.batchId}</span>
                                ${statusBadge}
                            </div>
                            <div class="text-sm font-medium text-slate-700">Osztály: <strong>${batch.ward}</strong> | Feladó: <strong>${batch.orderedBy}</strong> | Betegek: ${patientsCount} fő</div>
                            <div class="text-xs text-slate-500">Leadva: ${new Date(batch.createdAt).toLocaleString('hu-HU')} | Kért átvétel: <strong class="text-slate-700">${batch.pickupDate ? new Date(batch.pickupDate).toLocaleString('hu-HU') : '-'}</strong> | Összeállította: <strong class="text-indigo-700">${batch.assembledBy}</strong></div>
                        </div>
                        <div class="flex items-center space-x-4 self-end md:self-center">
                            ${reportIndicatorHtml}
                            <div class="text-right">
                                <span class="text-xs text-slate-400 block">Összesen</span>
                                <strong class="text-base text-indigo-900">${totalBoxes} doboz</strong>
                            </div>
                            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium shadow transition">Megnyitás →</button>
                        </div>
                    </div>
                `;

                const isFullyDispensed = batch.items.length > 0 && batch.items.filter(i => i.quantity > 0 && !i.patient_name.includes('[TÖRÖLVE]')).every(i => i.status === 'dispensed' || i.status === 'reported');

                if (isFullyDispensed) {
                    completedCount++;
                    completedContainer.innerHTML += cardHtml;
                } else {
                    activeCount++;
                    activeContainer.innerHTML += cardHtml;
                }
            });

            if (activeCount === 0) activeContainer.innerHTML = '<div class="p-6 text-center text-slate-400">Nincs aktív vagy függőben lévő rendelési csomag.</div>';
            if (completedCount === 0) completedContainer.innerHTML = '<div class="p-6 text-center text-slate-400">Nincs kiadott csomag az archívumban.</div>';
        }

        function openBatchModal(batchId) {
            activeBatchIdModal = batchId;
            const batchOrders = allOrdersData.filter(o => (o.order_batch_id || ('ID-' + o.id.slice(0, 8))) === batchId);
            if (batchOrders.length === 0) return;

            const first = batchOrders[0];
            document.getElementById('modal-title').innerText = `Rendelési csomag: ${batchId} (${first.ward_name})`;

            let contentHtml = `
                <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl flex flex-col md:flex-row justify-between gap-2 text-xs text-indigo-950 mb-3">
                    <div>
                        <p><strong>Igénylő osztály:</strong> ${first.ward_name}</p>
                        <p><strong>Rendelést feladta:</strong> <span class="text-indigo-900 font-semibold">${first.ordered_by || 'Ismeretlen'}</span></p>
                    </div>
                    <div>
                        <p><strong>Leadás ideje:</strong> ${new Date(first.created_at).toLocaleString('hu-HU')}</p>
                        <p><strong>Összeállította:</strong> <span class="text-indigo-900 font-semibold">${first.assembled_by || 'Még nincs összeállítva'}</span></p>
                    </div>
                </div>
                <div class="border rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-100 text-slate-600 uppercase">
                            <tr>
                                <th class="p-2.5">Gyógyszer</th>
                                <th class="p-2.5">Beteg neve & TAJ</th>
                                <th class="p-2.5">Szállítólevél | Gy.sz</th>
                                <th class="p-2.5">Státusz</th>
                                <th class="p-2.5 text-right">Mennyiség</th>
                                <th class="p-2.5 text-right">Műveletek</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            let totalBoxes = 0;
            batchOrders.forEach(ord => {
                const isCancelled = ord.quantity === 0 || ord.patient_name.includes('[TÖRÖLVE]');
                if (!isCancelled) {
                    totalBoxes += ord.quantity;
                }

                let deliveryInfo = ord.delivery_note_number 
                    ? `<strong class="text-indigo-900">${ord.delivery_note_number}</strong><br><span class="text-[10px] text-slate-500 font-mono">Gy.sz: ${ord.batch_number || '-'}</span>` 
                    : `<span class="text-amber-600 italic">Még nincs összekészítve</span>`;

                let itemStatusBadge = '';
                if (isCancelled) itemStatusBadge = '<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-[10px] font-semibold">Törölve (0 doboz)</span>';
                else if (ord.status === 'pending') itemStatusBadge = '<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-semibold">Függőben</span>';
                else if (ord.status === 'assembled') itemStatusBadge = '<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] font-semibold">Összeállítás alatt</span>';
                else if (ord.status === 'dispensed') itemStatusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-semibold">Kiadva</span>';
                else if (ord.status === 'reported') itemStatusBadge = '<span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-[10px] font-semibold">Jelentve ✓</span>';

                let modifiedBadge = ord.patient_name.includes('(Módosítva)') && !isCancelled
                    ? '<span class="text-[10px] text-amber-600 font-bold block">(Módosítva)</span>' 
                    : '';

                let rowStyleClass = isCancelled ? 'bg-red-50/50 opacity-75' : '';
                let textStyleClass = isCancelled ? 'line-through text-slate-400' : 'text-slate-800';
                let cleanPatientName = ord.patient_name ? ord.patient_name.replace(' (Módosítva)', '').replace('[TÖRÖLVE] ', '') : '';

                contentHtml += `
                    <tr id="row-${ord.id}" class="${rowStyleClass}">
                        <td class="p-2.5 font-medium ${textStyleClass}">${ord.drug_name}</td>
                        <td class="p-2.5 space-y-1">
                            <div id="text-display-${ord.id}" class="${textStyleClass}">
                                <strong class="block">${cleanPatientName}</strong>
                                <span class="text-slate-500 text-[11px]">TAJ: ${ord.patient_identifier || 'Nincs megadva'}</span>
                            </div>
                            <input type="text" id="pname-${ord.id}" value="${cleanPatientName}" disabled class="w-full px-2 py-1 border border-transparent bg-transparent rounded text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-transparent hidden" placeholder="Beteg neve">
                            <input type="text" id="pid-${ord.id}" value="${ord.patient_identifier || ''}" disabled placeholder="TAJ szám" class="w-full px-2 py-1 border border-transparent bg-transparent rounded text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-transparent hidden">
                            ${modifiedBadge}
                        </td>
                        <td class="p-2.5">${deliveryInfo}</td>
                        <td class="p-2.5">${itemStatusBadge}</td>
                        <td class="p-2.5 text-right font-semibold">
                            <span id="qty-display-${ord.id}" class="${textStyleClass}">${ord.quantity} doboz</span>
                            <input type="number" id="pqty-${ord.id}" value="${ord.quantity}" min="0" disabled class="w-16 px-2 py-1 border border-transparent bg-transparent rounded text-xs text-right font-semibold focus:ring-1 focus:ring-indigo-500 focus:outline-none disabled:bg-transparent hidden">
                        </td>
                        <td class="p-2.5 text-right space-x-1">
                            ${!isCancelled ? `
                                <button id="btn-edit-${ord.id}" onclick="enableEditItem('${ord.id}')" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded text-[11px] font-medium shadow transition">Módosítás</button>
                                <button id="btn-save-${ord.id}" onclick="saveOrderItem('${ord.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-[11px] font-medium shadow transition hidden">Mentés</button>
                                <button onclick="deleteOrderItem('${ord.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded text-[11px] font-medium shadow transition">Törlés</button>
                            ` : `<span class="text-xs text-red-600 italic font-medium">Törölve</span>`}
                        </td>
                    </tr>
                `;
            });

            contentHtml += `
                        </tbody>
                    </table>
                </div>
                <div class="text-right text-sm font-bold text-slate-800">
                    Csomag összesen: <span class="text-indigo-900">${totalBoxes} doboz</span>
                </div>
            `;

            document.getElementById('modal-content').innerHTML = contentHtml;

            const actionContainer = document.getElementById('modal-action-buttons');
            const hasActiveItems = batchOrders.some(o => o.quantity > 0 && !o.patient_name.includes('[TÖRÖLVE]'));

            if (!hasActiveItems) {
                actionContainer.innerHTML = `<span class="text-xs font-semibold text-red-700 bg-red-50 px-3 py-1.5 rounded-xl">Minden tétel törölve ebben a csomagban</span>`;
            } else if (first.status === 'pending') {
                actionContainer.innerHTML = `
                    <button onclick="assembleBatch('${batchId}')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow transition">
                        Összeállítás, szállítólevél hozzárendelése
                    </button>
                `;
            } else if (first.status === 'assembled') {
                actionContainer.innerHTML = `
                    <button onclick="dispenseBatch('${batchId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow transition">
                        Kiadás
                    </button>
                `;
            } else {
                actionContainer.innerHTML = `<span class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-xl">Kiadva és követve</span>`;
            }

            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
            activeBatchIdModal = null;
        }

        function enableEditItem(orderId) {
            const textDisplay = document.getElementById(`text-display-${orderId}`);
            const qtyDisplay = document.getElementById(`qty-display-${orderId}`);
            const nameInput = document.getElementById(`pname-${orderId}`);
            const idInput = document.getElementById(`pid-${orderId}`);
            const qtyInput = document.getElementById(`pqty-${orderId}`);
            const editBtn = document.getElementById(`btn-edit-${orderId}`);
            const saveBtn = document.getElementById(`btn-save-${orderId}`);

            textDisplay.classList.add('hidden');
            qtyDisplay.classList.add('hidden');

            nameInput.classList.remove('hidden', 'border-transparent', 'bg-transparent');
            nameInput.classList.add('border-slate-300', 'bg-white');
            nameInput.disabled = false;

            idInput.classList.remove('hidden', 'border-transparent', 'bg-transparent');
            idInput.classList.add('border-slate-300', 'bg-white', 'mt-1');
            idInput.disabled = false;

            qtyInput.classList.remove('hidden', 'border-transparent', 'bg-transparent');
            qtyInput.classList.add('border-slate-300', 'bg-white');
            qtyInput.disabled = false;

            editBtn.classList.add('hidden');
            saveBtn.classList.remove('hidden');

            nameInput.focus();
        }

        async function saveOrderItem(orderId) {
            const ord = allOrdersData.find(o => o.id === orderId);
            if (!ord) return;

            const newNameInput = document.getElementById(`pname-${orderId}`).value.trim();
            const newIdInput = document.getElementById(`pid-${orderId}`).value.trim();
            const newQty = parseInt(document.getElementById(`pqty-${orderId}`).value) || 1;

            if (!newNameInput) {
                alert('A beteg neve nem lehet üres!');
                return;
            }

            const finalName = newNameInput.includes('(Módosítva)') ? newNameInput : `${newNameInput} (Módosítva)`;

            if (ord.status === 'dispensed' || ord.status === 'reported') {
                const qtyDiff = newQty - ord.quantity;

                if (qtyDiff !== 0) {
                    const { data: invList, error: invErr } = await _supabase
                        .from('inventory_receipts')
                        .select('*')
                        .eq('delivery_note_number', ord.delivery_note_number)
                        .eq('batch_number', ord.batch_number);

                    if (invErr || !invList || invList.length === 0) {
                        alert('Hiba: Nem található a kapcsolódó bevételezési tétel a készletben!');
                        return;
                    }

                    const invItem = invList[0];

                    if (qtyDiff > 0) {
                        if (invItem.current_quantity < qtyDiff) {
                            alert(`Nincs elegendő raktárkészlet a növeléshez! Elérhető: ${invItem.current_quantity} doboz.`);
                            return;
                        }
                        await _supabase
                            .from('inventory_receipts')
                            .update({ current_quantity: invItem.current_quantity - qtyDiff })
                            .eq('id', invItem.id);
                    } else {
                        const returnQty = Math.abs(qtyDiff);
                        await _supabase
                            .from('inventory_receipts')
                            .update({ current_quantity: invItem.current_quantity + returnQty })
                            .eq('id', invItem.id);
                    }
                }
            }

            const { error } = await _supabase
                .from('orders')
                .update({
                    patient_name: finalName,
                    patient_identifier: newIdInput || null,
                    quantity: newQty
                })
                .eq('id', orderId);

            if (error) {
                alert('Hiba a mentés során: ' + error.message);
            } else {
                alert('Tétel sikeresen frissítve és jelölve! ✓');
                await loadPharmacyPackages();
                openBatchModal(activeBatchIdModal);
            }
        }

        async function deleteOrderItem(orderId) {
            if (!confirm('Biztosan törölni szeretnéd ezt a tételt? A sor áthúzva megmarad az archívumban, és a készlet visszakerül a raktárba.')) return;

            const ord = allOrdersData.find(o => o.id === orderId);
            if (!ord) return;

            if (ord.delivery_note_number && ord.quantity > 0) {
                const { data: invList } = await _supabase
                    .from('inventory_receipts')
                    .select('*')
                    .eq('delivery_note_number', ord.delivery_note_number)
                    .eq('batch_number', ord.batch_number);

                if (invList && invList.length > 0) {
                    const invItem = invList[0];
                    await _supabase
                        .from('inventory_receipts')
                        .update({ current_quantity: invItem.current_quantity + ord.quantity })
                        .eq('id', invItem.id);
                }
            }

            const cleanName = ord.patient_name ? ord.patient_name.replace(' (Módosítva)', '').replace('[TÖRÖLVE] ', '') : 'Törölt tétel';
            const finalDeletedName = `[TÖRÖLVE] ${cleanName}`;

            const { error } = await _supabase
                .from('orders')
                .update({
                    quantity: 0,
                    patient_name: finalDeletedName
                })
                .eq('id', orderId);

            if (error) {
                alert('Hiba a törlés során: ' + error.message);
            } else {
                alert('Tétel törölve, készlet visszatöltve a raktárba. ✓');
                await loadPharmacyPackages();
                openBatchModal(activeBatchIdModal);
            }
        }

        // Összeállítás: mostantól rögzíti a bejelentkezett patikus nevét is (assembled_by)
        async function assembleBatch(batchId) {
            const batchOrders = allOrdersData.filter(o => (o.order_batch_id || ('ID-' + o.id.slice(0, 8))) === batchId && o.quantity > 0 && !o.patient_name.includes('[TÖRÖLVE]'));

            const neededDrugs = {};
            batchOrders.forEach(o => {
                neededDrugs[o.drug_name] = (neededDrugs[o.drug_name] || 0) + o.quantity;
            });

            const { data: inventory, error: invErr } = await _supabase
                .from('inventory_receipts')
                .select('*')
                .gt('current_quantity', 0)
                .order('expiry_date', { ascending: true });

            if (invErr) {
                alert('Hiba a raktár lekérdezésekor: ' + invErr.message);
                return;
            }

            for (let [drugName, requiredQty] of Object.entries(neededDrugs)) {
                let availableQty = inventory
                    .filter(inv => inv.drug_name === drugName || drugName.includes(inv.drug_name) || inv.drug_name.includes(drugName))
                    .reduce((sum, inv) => sum + inv.current_quantity, 0);

                if (availableQty < requiredQty) {
                    alert(`HIBA: Nincs elegendő bevételezett készlet a(z) "${drugName}" gyógyszerből az összeállításhoz!\nSzükséges: ${requiredQty}, Elérhető: ${availableQty} doboz.`);
                    return;
                }
            }

            for (let ord of batchOrders) {
                let remaining = ord.quantity;
                let assignedDelivery = '';
                let assignedBatch = '';

                for (let inv of inventory) {
                    if (remaining <= 0) break;
                    if (inv.drug_name === ord.drug_name || ord.drug_name.includes(inv.drug_name) || inv.drug_name.includes(ord.drug_name)) {
                        let take = Math.min(inv.current_quantity, remaining);
                        if (take > 0) {
                            assignedDelivery = inv.delivery_note_number;
                            assignedBatch = inv.batch_number;
                            remaining -= take;
                        }
                    }
                }

                // Frissítjük a státuszt, a szállítólevelet, a gyári számot ÉS az összeállító nevét is
                await _supabase
                    .from('orders')
                    .update({ 
                        status: 'assembled',
                        delivery_note_number: assignedDelivery,
                        batch_number: assignedBatch,
                        assembled_by: currentUser
                    })
                    .eq('id', ord.id);
            }

            alert('Csomag sikeresen összeállítva! Szállítólevelek és név rögzítve. ✓');
            closeModal();
            loadPharmacyPackages();
        }

        async function dispenseBatch(batchId) {
            const batchOrders = allOrdersData.filter(o => (o.order_batch_id || ('ID-' + o.id.slice(0, 8))) === batchId && o.quantity > 0 && !o.patient_name.includes('[TÖRÖLVE]'));

            const neededDrugs = {};
            batchOrders.forEach(o => {
                neededDrugs[o.drug_name] = (neededDrugs[o.drug_name] || 0) + o.quantity;
            });

            const { data: inventory, error: invErr } = await _supabase
                .from('inventory_receipts')
                .select('*')
                .gt('current_quantity', 0)
                .order('expiry_date', { ascending: true });

            if (invErr) {
                alert('Hiba: ' + invErr.message);
                return;
            }

            for (let [drugName, requiredQty] of Object.entries(neededDrugs)) {
                let remainingToDeduct = requiredQty;

                for (let inv of inventory) {
                    if (remainingToDeduct <= 0) break;
                    if (inv.drug_name === drugName || drugName.includes(inv.drug_name) || inv.drug_name.includes(drugName)) {
                        let deduct = Math.min(inv.current_quantity, remainingToDeduct);
                        let newQty = inv.current_quantity - deduct;

                        await _supabase
                            .from('inventory_receipts')
                            .update({ current_quantity: newQty })
                            .eq('id', inv.id);

                        inv.current_quantity = newQty;
                        remainingToDeduct -= deduct;
                    }
                }
            }

            const orderIds = batchOrders.map(o => o.id);
            const { error } = await _supabase
                .from('orders')
                .update({ status: 'dispensed' })
                .in('id', orderIds);

            if (error) {
                alert('Hiba: ' + error.message);
            } else {
                alert('Csomag sikeresen kiadva az osztálynak! 🛡️');
                closeModal();
                loadPharmacyPackages();
            }
        }

        function printBoxLabels() {
            if (!activeBatchIdModal) return;
            const batchOrders = allOrdersData.filter(o => (o.order_batch_id || ('ID-' + o.id.slice(0, 8))) === activeBatchIdModal && o.quantity > 0 && !o.patient_name.includes('[TÖRÖLVE]'));
            if (batchOrders.length === 0) return;

            const container = document.getElementById('print-labels-container');
            container.innerHTML = '';

            batchOrders.forEach(ord => {
                const boxCount = ord.quantity || 1;
                for (let i = 1; i <= boxCount; i++) {
                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'drug-label';
                    labelDiv.innerHTML = `
                        <div style="border-bottom: 1px solid #000; padding-bottom: 1mm; display: flex; justify-content: space-between; font-weight: bold; font-size: 8pt;">
                            <span>🛡️ QGuard | ${ord.order_batch_id || 'Csomag'}</span>
                            <span>Doboz: ${i}/${boxCount}</span>
                        </div>
                        <div style="font-size: 10pt; font-weight: bold; margin-top: 0.5mm;">
                            ${ord.patient_name} <span style="font-size: 8pt; font-weight: normal;">(TAJ: ${ord.patient_identifier || 'Nincs'})</span>
                        </div>
                        <div style="font-size: 9pt; font-weight: bold; color: #1e1b4b;">
                            💊 ${ord.drug_name}
                        </div>
                        <div style="font-size: 7.5pt; color: #475569;">
                            Indikáció: ${ord.indication || 'Nincs megadva'}
                        </div>
                        <div style="font-size: 7.5pt; border-top: 1px solid #ccc; padding-top: 1mm; display: flex; justify-content: space-between;">
                            <span>Sz.lev: <strong>${ord.delivery_note_number || 'Folyamatban'}</strong></span>
                            <span>Gy.sz: <strong>${ord.batch_number || '-'}</strong></span>
                        </div>
                        <div style="font-size: 6.5pt; text-align: right; color: #64748b;">
                            Dátum: ${new Date(ord.created_at).toLocaleDateString('hu-HU')}

                    `;
                    container.appendChild(labelDiv);
                }
            });

            document.body.classList.add('print-labels');
            window.print();
            document.body.classList.remove('print-labels');
        }

        // A4-es Összesítő nyomtatása - a feladó és az összeállító az adatok között szerepel
        function printA4Summary() {
            if (!activeBatchIdModal) return;

            let patientsCount = new Set(validItems.map(i => i.patient_name)).size;

            let rowsHtml = '';
            batchOrders.forEach((ord, index) => {
                const isCancelled = ord.quantity === 0 || ord.patient_name.includes('[TÖRÖLVE]');
                let rowStyle = isCancelled ? 'background: #fef2f2; color: #94a3b8; text-decoration: line-through;' : '';

                rowsHtml += `
                    <tr style="${rowStyle}">
                        <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center;">${index + 1}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; font-weight: bold;">${ord.drug_name}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px;">${ord.patient_name} <br><span style="font-size: 8pt; color: #64748b;">TAJ: ${ord.patient_identifier || '-'}</span> ${statusText}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; font-size: 8.5pt;">${ord.indication || '-'}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; font-family: monospace;">Sz.lev: ${ord.delivery_note_number || '-'}<br>Gy.sz: ${ord.batch_number || '-'}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; font-weight: bold;">${isCancelled ? '0 doboz' : (ord.quantity + ' doboz')}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div style="max-width: 190mm; margin: 0 auto; font-family: sans-serif; color: #000; background: white;">
                    <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #1e1b4b; padding-bottom: 10px; margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; font-size: 18pt; color: #1e1b4b;">🛡️ QuotaGuard Kórházi Gyógyszerészet</h2>
                            <p style="margin: 3px 0 0 0; font-size: 10pt; color: #475569;">Markusovszky Egyetemi Oktatókórház Közforgalmú Gyógyszertára</p>
                        </div>
                        <div style="text-align: right;">
                            <h3 style="margin: 0; font-size: 14pt; color: #334155;">OSZTÁLYI CSOMAG ÖSSZESÍTŐ</h3>
                            <p style="margin: 3px 0 0 0; font-size: 10pt; font-weight: bold; color: #1e1b4b;">Csomag azonosító: ${first.order_batch_id || 'N/A'}</p>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 10pt; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <div>
                            <p style="margin: 2px 0;"><strong>Igénylő osztály:</strong> ${first.ward_name}</p>
                            <p style="margin: 2px 0;"><strong>Rendelést feladta:</strong> ${first.ordered_by || 'Ismeretlen'}</p>
                            <p style="margin: 2px 0;"><strong>Leadás ideje:</strong> ${new Date(first.created_at).toLocaleString('hu-HU')}</p>
                        </div>
                        <div style="text-align: right;">
                            <p style="margin: 2px 0;"><strong>Összeállította:</strong> ${first.assembled_by || 'Még nincs összeállítva'}</p>
                            <p style="margin: 2px 0;"><strong>Érintett betegek száma:</strong> ${patientsCount} fő</p>
                            <p style="margin: 2px 0; font-size: 11pt; color: #1e1b4b;"><strong>Teljes mennyiség:</strong> ${totalBoxes} doboz</p>
                        </div>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-bottom: 30px;">
                        <thead>
                            <tr style="background: #1e1b4b; color: white;">
                                <th style="padding: 8px; border: 1px solid #1e1b4b; text-align: center; width: 30px;">#</th>
                                <th style="padding: 8px; border: 1px solid #1e1b4b; text-align: left;">Gyógyszer neve</th>

                                <th style="padding: 8px; border: 1px solid #1e1b4b; text-align: center; width: 70px;">Mennyiség</th>

                        <tbody>

                    <!-- Aláírási blokk -->
                    <div style="display: flex; justify-content: space-between; margin-top: 50px; font-size: 10pt; page-break-inside: avoid;">
                        <div style="text-align: center; width: 45%;">
                            <div style="border-bottom: 1px solid #000; margin-bottom: 8px; height: 40px;"></div>
                            <strong>Kiadta (Központi Gyógyszertár):</strong><br>
                            <span style="font-size: 9pt; color: #475569;">Név / Pecsét / Aláírás</span>

                            <div style="border-bottom: 1px solid #000; margin-bottom: 8px; height: 40px;"></div>

        }
    </script>
