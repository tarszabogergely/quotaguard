<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Korábbi rendeléseim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span id="ward-badge" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Osztály</span>
            </div>
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800">
                <a href="ward-new-order.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Új rendelés</a>
                <a href="ward-my-orders.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow">Korábbi rendeléseim</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center">
                <span class="mr-2">📋</span> Osztályi rendelési csomagok előzményei
            </h2>
            <div id="ward-packages-container" class="space-y-4">
                <div class="p-6 text-center text-slate-400">Rendelések betöltése...</div>
            </div>
        </div>
    </main>

    <!-- Részletek Modális Ablak -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Csomag részletei</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
            </div>
            
            <div id="modal-content" class="space-y-4 text-sm">
                <!-- Dinamikus tartalom -->
            </div>

            <div class="border-t pt-4 flex justify-end">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-medium shadow transition">Bezárás</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentWard = localStorage.getItem('qg_ward');
        let allWardOrders = [];

        if (!currentUser || localStorage.getItem('qg_role') !== 'ward') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            document.getElementById('ward-badge').innerText = currentWard;
            loadWardPackages();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadWardPackages() {
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('ward_name', currentWard)
                .order('created_at', { ascending: false });

            const container = document.getElementById('ward-packages-container');

            if (error) {
                container.innerHTML = `<div class="p-6 text-center text-red-500">Hiba: ${error.message}</div>`;
                return;
            }

            allWardOrders = data || [];

            if (allWardOrders.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400">Még nincsenek leadott rendelések ettől az osztálytól.</div>`;
                return;
            }

            // Csoportosítás batch_id alapján
            const batches = {};
            allWardOrders.forEach(order => {
                const bId = order.order_batch_id || ('ID-' + order.id.slice(0, 8));
                if (!batches[bId]) {
                    batches[bId] = {
                        batchId: bId,
                        createdAt: order.created_at,
                        pickupDate: order.requested_pickup_date,
                        items: []
                    };
                }
                batches[bId].items.push(order);
            });

            container.innerHTML = '';
            Object.values(batches).forEach(batch => {
                let totalBoxes = batch.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
                let patientsCount = new Set(batch.items.map(i => i.patient_name)).size;
                
                // Megszámoljuk, hány elem nincs még lejelentve (azaz nem 'reported')
                let pendingReportCount = batch.items.filter(i => i.status !== 'reported').length;
                let allReported = pendingReportCount === 0;

                let statusBadge = '';
                if (allReported) {
                    statusBadge = '<span class="bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full text-xs font-semibold">Minden tétel lejelentve ✓</span>';
                } else {
                    let hasDispensed = batch.items.some(i => i.status === 'dispensed');
                    let hasAssembled = batch.items.some(i => i.status === 'assembled');
                    
                    if (hasDispensed) statusBadge = `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">Kiadva (${pendingReportCount} még nem jelentve)</span>`;
                    else if (hasAssembled) statusBadge = '<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-semibold">Összeállítva a Patikában</span>';
                    else statusBadge = '<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-xs font-semibold">Függőben</span>';
                }

                const cardHtml = `
                    <div class="bg-slate-50 border border-slate-200 hover:border-indigo-300 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition shadow-sm cursor-pointer" onclick="openBatchModal('${batch.batchId}')">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-mono font-bold text-indigo-900">${batch.batchId}</span>
                                ${statusBadge}
                            </div>
                            <div class="text-sm font-medium text-slate-700">Kedvezményezett betegek száma: <strong>${patientsCount} fő</strong></div>
                            <div class="text-xs text-slate-500">Leadva: ${new Date(batch.createdAt).toLocaleString('hu-HU')} | Kért átvétel: ${batch.pickupDate ? new Date(batch.pickupDate).toLocaleString('hu-HU') : '-'}</div>
                        </div>
                        <div class="flex items-center space-x-4 self-end md:self-center">
                            <div class="text-right">
                                <span class="text-xs text-slate-400 block">Összesen</span>
                                <strong class="text-base text-indigo-900">${totalBoxes} doboz</strong>
                            </div>
                            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-medium shadow transition">Részletek →</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function openBatchModal(batchId) {
            const batchOrders = allWardOrders.filter(o => (o.order_batch_id || ('ID-' + o.id.slice(0, 8))) === batchId);
            if (batchOrders.length === 0) return;

            const first = batchOrders[0];
            document.getElementById('modal-title').innerText = `Rendelési csomag részletei: ${batchId}`;

            let contentHtml = `
                <div class="text-xs text-slate-500 mb-3">
                    Leadva: ${new Date(first.created_at).toLocaleString('hu-HU')} | Átvétel: ${first.requested_pickup_date ? new Date(first.requested_pickup_date).toLocaleString('hu-HU') : '-'}
                </div>
                <div class="border rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-100 text-slate-600 uppercase">
                            <tr>
                                <th class="p-2.5">Gyógyszer</th>
                                <th class="p-2.5">Beteg neve (TAJ)</th>
                                <th class="p-2.5">Szállítólevél</th>
                                <th class="p-2.5">Beteg állapota</th>
                                <th class="p-2.5 text-right">Mennyiség</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            let totalBoxes = 0;
            batchOrders.forEach(ord => {
                totalBoxes += ord.quantity;
                let deliveryInfo = ord.delivery_note_number 
                    ? `<strong class="text-indigo-900">${ord.delivery_note_number}</strong><br><span class="text-[10px] text-slate-500 font-mono">Gy.sz: ${ord.batch_number || '-'}</span>`
                    : `<span class="text-slate-400 italic">Folyamatban</span>`;

                let itemStatusBadge = '';
                if (ord.status === 'pending') itemStatusBadge = '<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-semibold">Függőben</span>';
                else if (ord.status === 'assembled') itemStatusBadge = '<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] font-semibold">Összeállítva</span>';
                else if (ord.status === 'dispensed') itemStatusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-semibold">Kiadva</span>';
                else if (ord.status === 'reported') itemStatusBadge = '<span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-[10px] font-semibold">Jelentve ✓</span>';

                contentHtml += `
                    <tr>
                        <td class="p-2.5 font-medium">${ord.drug_name}</td>
                        <td class="p-2.5">${ord.patient_name} <span class="text-slate-400">(${ord.patient_identifier || '-'})</span></td>
                        <td class="p-2.5">${deliveryInfo}</td>
                        <td class="p-2.5">${itemStatusBadge}</td>
                        <td class="p-2.5 text-right font-semibold">${ord.quantity} doboz</td>
                    </tr>
                `;
            });

            contentHtml += `
                        </tbody>
                    </table>
                </div>
                <div class="text-right text-sm font-bold text-slate-800">
                    Csomag összesen: <span class="text-indigo-900">${totalBoxes} doboz</span>
                </div>
            `;

            document.getElementById('modal-content').innerHTML = contentHtml;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }
    </script>
</body>
</html>
