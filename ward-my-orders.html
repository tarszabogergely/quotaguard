<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Korábbi rendeléseim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span id="ward-badge" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Osztály</span>
            </div>
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800">
                <a href="ward-new-order.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Új rendelés</a>
                <a href="ward-my-orders.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow">Korábbi rendeléseim</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100 mt-4">
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center">
                <span class="mr-2">📋</span> Osztályi rendelések előzményei
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-xl">Dátum / Idő</th>
                            <th class="p-3">Beteg (TAJ)</th>
                            <th class="p-3">Gyógyszer</th>
                            <th class="p-3">Mennyiség</th>
                            <th class="p-3">Státusz</th>
                            <th class="p-3 rounded-r-xl">Kért átvétel</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-slate-400">Rendelések betöltése...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentWard = localStorage.getItem('qg_ward');

        if (!currentUser || localStorage.getItem('qg_role') !== 'ward') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            document.getElementById('ward-badge').innerText = currentWard;
            loadMyOrders();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadMyOrders() {
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('ward_name', currentWard)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('orders-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Hiba: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Még nincsenek leadott rendelések ettől az osztálytól.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(order => {
                let statusBadge = '';
                if (order.status === 'pending') statusBadge = '<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full text-xs font-semibold">Függőben</span>';
                else if (order.status === 'assembled') statusBadge = '<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-semibold">Összeállítva</span>';
                else if (order.status === 'dispensed') statusBadge = '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-semibold">Kiadva</span>';
                else statusBadge = `<span class="bg-slate-100 text-slate-800 px-2.5 py-1 rounded-full text-xs font-semibold">${order.status}</span>`;

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">${new Date(order.created_at).toLocaleString('hu-HU')}</td>
                    <td class="p-3 font-medium">${order.patient_name}<br><span class="text-xs text-slate-400 font-normal">${order.patient_identifier || ''}</span></td>
                    <td class="p-3">${order.drug_name}</td>
                    <td class="p-3 font-semibold">${order.quantity} doboz</td>
                    <td class="p-3">${statusBadge}</td>
                    <td class="p-3 text-slate-600 text-xs">${order.requested_pickup_date ? new Date(order.requested_pickup_date).toLocaleString('hu-HU') : '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
