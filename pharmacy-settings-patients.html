<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuotaGuard - Patika: Betegek Adatbázisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header & Patika Navigáció -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">QuotaGuard</h1>
                <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">Központi Gyógyszertár</span>
            </div>
            <!-- Patikai Menüsor -->
            <nav class="flex items-center space-x-2 bg-indigo-950/50 p-1.5 rounded-xl border border-indigo-800 text-xs">
                <a href="pharmacy-orders.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Beérkező rendelések</a>
                <a href="pharmacy-database.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Adatbázis</a>
                <a href="pharmacy-inventory.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">Bevétel & Készlet</a>
                <a href="pharmacy-cato.html" class="text-indigo-200 hover:text-white px-3 py-1.5 rounded-lg font-medium transition focus:outline-none focus:ring-0">CATO</a>
                <a href="pharmacy-settings.html" class="bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow focus:outline-none focus:ring-0">Beállítások</a>
            </nav>
            <div class="text-sm text-indigo-200 flex items-center space-x-3">
                <span><strong id="logged-user" class="text-white"></strong></span>
                <button onclick="logout()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1 rounded-lg text-xs transition">Kilépés</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Almenü / Vissza a beállításokhoz -->
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="pharmacy-settings.html" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition">
                    ← Vissza a Beállításokhoz
                </a>
                <h2 class="text-lg font-bold text-slate-900 flex items-center">
                    <span class="mr-2">👥</span> Kezelt betegek adatbázisa & Archívum
                </h2>
            </div>
            <div class="w-72">
                <input type="text" id="patient-search" oninput="filterPatients()" placeholder="Keresés név vagy TAJ alapján..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <!-- Betegek Listája Kártya -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <div id="patients-container" class="overflow-x-auto">
                <div class="p-6 text-center text-slate-400 text-sm">Betegek betöltése...</div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://qglicccrflohqkhadthc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kdK4lOXv11t_zzbSa7H4qA_YyhhPu1N';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = localStorage.getItem('qg_user');
        let currentRole = localStorage.getItem('qg_role');
        let allPatientsData = [];

        if (!currentUser || currentRole !== 'pharmacy') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('logged-user').innerText = currentUser;
            loadAllPatients();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadAllPatients() {
            // Mivel a betegek a rendelésekhez (orders tábla) kapcsolódnak, innen gyűjtjük ki őket egyedileg
            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Hiba:', error);
                document.getElementById('patients-container').innerHTML = '<div class="p-6 text-center text-red-500 text-sm">Hiba történt az adatok betöltése közben.</div>';
                return;
            }

            allPatientsData = data || [];
            renderPatientsTable(allPatientsData);
        }

        function renderPatientsTable(orders) {
            const container = document.getElementById('patients-container');

            if (orders.length === 0) {
                container.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Nincsenek rögzített betegek az adatbázisban.</div>';
                return;
            }

            // Egyedi betegek szűrése TAJ szám vagy név alapján, hogy ne duplikálódjanak, de látszódjon az előzményük
            let tableHtml = `
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-100 text-slate-600 uppercase">
                        <tr>
                            <th class="p-3">Beteg neve</th>
                            <th class="p-3">TAJ szám</th>
                            <th class="p-3">Legutóbbi osztály</th>
                            <th class="p-3">Utolsó gyógyszer</th>
                            <th class="p-3 text-center">Rendelések száma</th>
                            <th class="p-3 text-right">Utolsó rendelés ideje</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
            `;

            // Csoportosítás beteg / TAJ alapján
            const patientMap = {};
            orders.forEach(ord => {
                let cleanName = ord.patient_name ? ord.patient_name.replace(' (Módosítva)', '').replace('[TÖRÖLVE] ', '') : 'Ismeretlen';
                let key = ord.patient_identifier || cleanName;

                if (!patientMap[key]) {
                    patientMap[key] = {
                        name: cleanName,
                        identifier: ord.patient_identifier || 'Nincs megadva',
                        ward: ord.ward_name,
                        lastDrug: ord.drug_name,
                        count: 0,
                        lastDate: ord.created_at
                    };
                }
                patientMap[key].count++;
            });

            const uniquePatients = Object.values(patientMap);

            uniquePatients.forEach(p => {
                let isDeletedMarker = p.name.includes('[TÖRÖLVE]') ? '<span class="text-red-500 text-[10px] block">[Törölt tétel]</span>' : '';
                
                tableHtml += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-semibold text-slate-900">${p.name} ${isDeletedMarker}</td>
                        <td class="p-3 font-mono text-slate-600">${p.identifier}</td>
                        <td class="p-3 text-slate-700">${p.ward}</td>
                        <td class="p-3 text-indigo-900 font-medium">${p.lastDrug}</td>
                        <td class="p-3 text-center font-bold">${p.count} db</td>
                        <td class="p-3 text-right text-slate-500">${new Date(p.lastDate).toLocaleString('hu-HU')}</td>
                    </tr>
                `;
            });

            tableHtml += `
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHtml;
        }

        function filterPatients() {
            const query = document.getElementById('patient-search').value.toLowerCase();
            const filtered = allPatientsData.filter(ord => {
                const name = ord.patient_name ? ord.patient_name.toLowerCase() : '';
                const taj = ord.patient_identifier ? ord.patient_identifier.toLowerCase() : '';
                return name.includes(query) || taj.includes(query);
            });
            renderPatientsTable(filtered);
        }
    </script>
</body>
</html>
